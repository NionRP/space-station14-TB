- type: entity
  name: Chewing gum Turbo
  parent: CandyBase
  id: FoodCandyTurbo1
  suffix: Tiny Bunny
  description: Turbo is a peach- or fruit-flavored chewing gum produced by the Turkish company Kent Gida, containing inserts with photographs, usually of cars or motorcycles.
  components:
  - type: FlavorProfile
    flavors:
      - fortunecookie
  - type: Sprite
    scale: 0.6, 0.6
    state: turbo1
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 1
        reagents:
        - ReagentId: Nutriment
          Quantity: 1
  - type: Item
    sprite: Objects/Consumable/Food/snacks.rsi
    heldPrefix: packet
    size: Tiny
  - type: Food
    trash: FoodTurbo1

