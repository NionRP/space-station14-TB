- type: entity
  id: KoverP
  name: Советский ковер
  suffix: Tiny Bunny
  description: Пышный ворсовый ковер с традиционным орнаментом, создающий уют и тепло в любом советском интерьере
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: Sprite
    sprite: Imperial/TinyBunny/kovriP.rsi
    state: kover_USSR
    drawdepth: FloorTiles
  - type: Transform
    anchored: true
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

