- type: entity
  id: CarpetUSSR
  name: Soviet carpet
  suffix: Tiny Bunny
  description: A lush pile carpet with a traditional pattern that creates coziness and warmth in any interior.
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: Sprite
    sprite: Imperial/TinyBunny/Decoration/CarpetsFloor.rsi
    state: Carpet_USSR
    drawdepth: FloorTiles
  - type: Transform
    anchored: true
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

