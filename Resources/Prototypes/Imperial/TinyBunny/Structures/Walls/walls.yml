  description: Вот-вот разрушится, если по ней постучать.
  suffix: Tiny Bunny, Wall
  components:
  - type: Tag
    tags:
      - Wall
  - type: Sprite
    sprite: Imperial/TinyBunny/Structures/Walls/concrete.rsi
  - type: Icon
    sprite: Imperial/TinyBunny/Structures/Walls/concrete.rsi
  - type: IconSmooth
    key: walls
    base: concrete
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              path: /Audio/Effects/metal_break1.ogg

- type: entity
  id: TBWallRockBasalt
  name: basalt
  parent: BaseWall
  components:
    - type: Icon
      sprite: Structures/Walls/rock.rsi
      state: rock_wall
    - type: Sprite
      sprite: Structures/Walls/rock.rsi
      layers:
        - state: rock_wall
        - map: [ "enum.EdgeLayer.South" ]
          state: rock_wall_south
        - map: [ "enum.EdgeLayer.East" ]
          state: rock_wall_east
        - map: [ "enum.EdgeLayer.North" ]
          state: rock_wall_north
        - map: [ "enum.EdgeLayer.West" ]
          state: rock_wall_west
    - type: Destructible
