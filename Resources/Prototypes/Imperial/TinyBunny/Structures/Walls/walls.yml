- type: entity
  parent: BaseWall
  id: TBWallWood
  name: Деревянная стена
  suffix: Tiny Bunny, Wall
  components:
  - type: Tag
    tags:
      - Wall
  - type: Sprite
    sprite: Imperial/TinyBunny/Structures/Walls/wood.rsi
  - type: Icon
    sprite: Imperial/TinyBunny/Structures/Walls/wood.rsi
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: IconSmooth
    key: walls
    base: wood
  - type: Destructible
    thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 500
          behaviors:
            - !type:SpawnEntitiesBehavior
              spawn:
                Girder:
                  min: 1
                  max: 1
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
