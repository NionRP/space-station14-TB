
- type: entity
  parent: BaseStructure
  id: BaseFenceWooden
  name: Деревянный забор
  suffix: Tiny Bunny, Wall
  description: Старый деревянный забор - доски да гвозди
  abstract: true
  components:
  - type: Sprite
    sprite: Imperial/TinyBunny/Structures/Walls/zabor_wooden.rsi
    drawdepth: WallTops
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: FlimsyMetallic
  - type: Appearance
  - type: AnimationPlayer

- type: entity
  parent: BaseFenceWooden
  id: FenceWoodenBroken
  name: Сломанный деревянный забор
  suffix: Tiny Bunny, Wall
  description: Старый деревянный забор - доски да гвозди. Интересно, кто же умудрился его сломать?
  components:
  - type: Sprite
    layers:
    - state: straight_broken
  - type: Physics
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.10,-0.5,0.10,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - TableLayer
        - MidImpassable
        - LowImpassable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/metal_break1.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseFenceWooden
  id: FenceWoodenStraight
  suffix: Tiny Bunny, Wall
  components:
  - type: Icon
    sprite: Imperial/TinyBunny/Structures/Walls/zabor_wooden.rsi
    state: icon_straight
  - type: Sprite
    layers:
    - state: straight
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.10,-0.5,0.10,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - WallLayer

- type: entity
  parent: BaseFenceWooden
  id: FenceWoodenCorner
  suffix: Tiny Bunny, Wall
  components:
  - type: Sprite
    layers:
    - state: corner
  - type: Fixtures
    fixtures:
      # needs two shapes to properly handle a triangle corner without weirdness
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - MidImpassable
        - LowImpassable
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.1,-0.1,0.1"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - WallLayer

