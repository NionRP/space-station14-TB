- type: entity
  id: StalkerMetalDoor
  name: металическая дверь
  parent: BaseMaterialDoor
  description: Старая металическая дверь.
  suffix: Tiny Bunny
  components:
  - type: Sprite
    sprite: Imperial\TinyBunny\Structures\Doors\metalgate.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 4000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy

- type: entity
  id: MetalDoorTB
  name: Стальная дверь
  suffix: Tiny Bunny
  parent: BaseMaterialDoor
  description: Обычная стальная дверь.
  components:
  - type: Sprite
    sprite: Imperial/TinyBunny/Structures/Doors/Doors/metal/metal.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - AirlockLayer
  - type: Door
    bumpOpen: false
    clickOpen: true
    closeTimeOne: 0
    closeTimeTwo: 0
    openTimeOne: 0
    openTimeTwo: 0
    openSound:
      path: /Audio/Effects/door_open.ogg
    closeSound:
      path: /Audio/Effects/door_close.ogg
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: IconSmooth
    enabled: false

