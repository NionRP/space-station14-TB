- type: entity
  id: Gate
  name: Створка ворот
  parent: BaseMaterialDoor
  description: Жёсткая рама, которую изготавливают из трубы квадратного сечения. Облицовкой служит металлический профнастил, покрытый полимерным покрытием. Неплохо сохранилась для своих лет.
  suffix: Tiny Bunny, левая
  components:
  - type: Sprite
    sprite: Imperial/TinyBunny/Structures/Doors/Gate/Gate.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    bumpOpen: false
    clickOpen: true
    closeTimeOne: 0.2
    closeTimeTwo: 0.6
    openTimeOne: 0.6
    openTimeTwo: 0.2
    openSound:
      path: /Audio/Imperial/TinyBunny/Effects/door_metal_open.ogg
    closeSound:
      path: /Audio/Imperial/TinyBunny/Effects/door_metal_close.ogg


