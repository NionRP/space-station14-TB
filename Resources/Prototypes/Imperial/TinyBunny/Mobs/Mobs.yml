- type: entity
  name: Fox
  id: Alice
  suffix: Tiny Bunny
  parent: [ SimpleSpaceMobBase, MobCombat ]
  description: Mysterious girl in a fox mask
  components:
    - type: InputMover
    - type: MobMover
    - type: NpcFactionMember
      factions:
        - SimpleHostile
    - type: Sprite
      drawdepth: Mobs
      layers:
      - map: ["enum.DamageStateVisualLayers.Base"]
        sprite: Imperial/TinyBunny/Mobs/Alice/Alice.rsi
        state: Alice
    - type: CombatMode
    - type: Physics
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.35
          density: 250
          mask:
          - MobMask
          layer:
          - MobLayer
    - type: MobState
    - type: DamageStateVisuals
      states:
        Alive:
          Base: Alice
        Critical:
          Base: Alice_dead
        Dead:
          Base: Alice_dead
    - type: MobThresholds
      thresholds:
        0: Alive
        400: Critical
        500: Dead
    - type: MeleeWeapon
      altDisarm: false
      angle: 0
      animation: WeaponArcClaw
      soundHit:
        path: /Audio/Weapons/Xeno/alien_claw_flesh2.ogg
      damage:
        types:
          Bloodloss: 10
          Slash: 10
          Structural: 35
    - type: Tag
      tags:
        - DoorBumpOpener
        - NoPaint
    - type: Speech
      speechSounds: DoctorDefVoice
    - type: Hands
    - type: MovementSpeedModifier
      baseWalkSpeed : 3
      baseSprintSpeed : 5
    - type: Body
      prototype: Human
    - type: NoSlip
    - type: Vocal
      sounds:
        Male: AliceVoice
        Unsexed: AliceVoice
        Female: AliceVoice
    - type: SlowOnDamage
      speedModifierThresholds:
        300: 0.8
    - type: Access
      groups:
      - Captain
    - type: AutoImplant
      implants:
       - StorageImplant

